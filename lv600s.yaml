esphome:
  name: lv600s-humidifier
  friendly_name: LV600S Humidifier

esp32:
  board: esp32dev
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

logger:
  level: DEBUG
  baud_rate: 0
  logs:
    lv600s_humidifier: DEBUG
    number: WARN
    switch: WARN
    sensor: WARN
    binary_sensor: WARN
    text_sensor: WARN
    select: WARN

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "LV600S Setup"
    password: !secret fallback_ap_password

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [lv600s_humidifier]

# Stock firmware initializes UART1 at 9600 baud with TX GPIO17 and RX GPIO16.
uart:
  id: mcu_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

lv600s_humidifier:
  id: lv600s
  uart_id: mcu_uart
  # The MCU pushes status changes (0x4111), so polling is only a safety net.
  status_interval: 30s
  # Drive the Wi-Fi icon on the panel: on = Home Assistant connected, slow blink = not connected,
  # fast blink = setup hotspot active.
  wifi_led: true
  # The panel long press that stock firmware uses for Wi-Fi pairing opens the "LV600S Setup" hotspot.
  hotspot_on_long_press: true
  hotspot_timeout: 15min
  power:
    name: "Power State"
    entity_category: diagnostic
    disabled_by_default: true
  display:
    name: "Display State"
    entity_category: diagnostic
    disabled_by_default: true
  water_lacks:
    name: "Water Low"
  tank_removed:
    name: "Tank Removed"
  humidifying:
    name: "Humidifying"
  warm_enabled:
    name: "Warm Enabled"
    entity_category: diagnostic
    disabled_by_default: true
  current_humidity:
    name: "Current Humidity"
  current_temperature:
    name: "Current Temperature"
  target_humidity:
    name: "Target Humidity State"
    entity_category: diagnostic
    disabled_by_default: true
  mist_level:
    name: "Mist Level State"
    entity_category: diagnostic
    disabled_by_default: true
  warm_level:
    name: "Warm Level State"
    entity_category: diagnostic
    disabled_by_default: true
  timer_remaining:
    name: "Timer Remaining"
    entity_category: diagnostic
  display_config:
    name: "Display Config Raw"
    disabled_by_default: true
  mode:
    name: "Mode Raw"
    disabled_by_default: true
  fog_status:
    name: "Fog Status Raw"
    disabled_by_default: true
  container_state:
    name: "Container State Raw"
    disabled_by_default: true
  status_byte_14:
    name: "Status Byte 14 Raw"
    disabled_by_default: true
  other_exception:
    name: "Other Exception Raw"
    disabled_by_default: true
  mcu_version:
    name: "MCU Version"
    disabled_by_default: true
  last_frame:
    name: "Last A5 Frame"
    disabled_by_default: true
  last_ack:
    name: "Last A5 ACK"
    disabled_by_default: true

switch:
  - platform: lv600s_humidifier
    power:
      name: "Power"
    display:
      name: "Display"

select:
  - platform: lv600s_humidifier
    mode:
      name: "Mode"

event:
  - platform: lv600s_humidifier
    panel_button:
      name: "Panel Button"

number:
  - platform: lv600s_humidifier
    target_humidity:
      name: "Target Humidity"
      mode: slider
    mist_level:
      name: "Mist Level"
      mode: slider
    warm_level:
      name: "Warm Level"
      mode: slider
    timer_minutes:
      name: "Timer Minutes"
      mode: box

  - platform: template
    name: "Manual Mode Mist Level"
    min_value: 1
    max_value: 9
    step: 1
    mode: box
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_value: false
    set_action:
      - lambda: id(lv600s).set_manual_mode_level(0, 1, (uint8_t) x);

  - platform: template
    name: "Manual Mode Warm Level"
    min_value: 0
    max_value: 3
    step: 1
    mode: box
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_value: false
    set_action:
      - lambda: id(lv600s).set_manual_mode_level(1, 0, (uint8_t) x);

  - platform: template
    name: "Humidity Mode Raw"
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_value: false
    set_action:
      - lambda: id(lv600s).set_humidity_mode_raw((uint8_t) x);

  - platform: template
    name: "Sleep Mode Raw"
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_value: false
    set_action:
      - lambda: id(lv600s).set_sleep_mode_raw((uint8_t) x);

button:
  - platform: lv600s_humidifier
    query_status:
      name: "Query Status"
    clear_timer:
      name: "Clear Timer"
    start_hotspot:
      name: "Start Setup Hotspot"
